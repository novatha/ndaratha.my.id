# Konfigurasi Eclipse Mosquitto 2.0 — Lab-4 Minggu 6 Teknologi IoT UNIB
# Catatan: allow_anonymous hanya untuk lingkungan lab lokal Minggu 6.
# Autentikasi TLS/mTLS dan ACL per topik akan diterapkan pada Minggu 12 (Lab-9).

listener 1883 0.0.0.0
protocol mqtt

listener 9001 0.0.0.0
protocol websockets

allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# Logging detail agar transaksi QoS 0/1/2, PINGREQ, dan LWT terlihat jelas
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp true
