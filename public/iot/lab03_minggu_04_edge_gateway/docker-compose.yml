version: '3.8'

services:
  # Layanan 1: Ingestion Serial dan Reserialisasi Data
  gateway-bridge:
    build: .
    container_name: unib_gateway_bridge
    restart: unless-stopped
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    environment:
      - SERIAL_PORT=/dev/ttyUSB0
      - BAUD_RATE=115200
      - DB_PATH=/app/data/telemetry_cache.db
      - MQTT_HOST=local-broker
      - MQTT_PORT=1883
    depends_on:
      - local-broker
    volumes:
      - buffer-data:/app/data

  # Layanan 2: Broker MQTT Lokal di Edge Gateway
  local-broker:
    image: eclipse-mosquitto:2.0
    container_name: unib_local_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data

volumes:
  buffer-data:
  mosquitto-data:
